name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:engines
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @vscode/vsce 4.x requires Node >= 22
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build the VSIX
        run: npm run package
      - name: Upload the VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-wire-vsix
          path: '*.vsix'
          if-no-files-found: error

  required-checks:
    name: Required checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [build, package]
    steps:
      - name: Check validation matrix
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Validation matrix failed"
            exit 1
          fi
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "Packaging failed"
            exit 1
          fi
